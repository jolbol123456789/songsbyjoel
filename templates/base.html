<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Joel">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$share_image">
  <meta property="og:image:width" content="$share_width">
  <meta property="og:image:height" content="$share_height">
  <meta property="og:image:alt" content="Joel">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  <meta name="twitter:image" content="$share_image">
  <link rel="icon" href="${root}assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="${root}assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="${root}assets/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" href="${root}assets/fonts/outfit_n4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="${root}assets/fonts/rethink_sans_n7.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="${root}assets/style.css?v=$css_version">
  <script src="${root}assets/player.js?v=$js_version" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <input type="checkbox" id="menu-toggle" class="menu-toggle visually-hidden" aria-label="Menu">
      <label for="menu-toggle" class="header-icon menu-open" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 16 16" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M16 3.75H0V2.25H16V3.75ZM16 8.75H0V7.25H16V8.75ZM16 13.75H0V12.25H16V13.75Z"/></svg>
      </label>
      <a class="logo" href="$root"$home_current><img src="${root}assets/logo.png" alt="Joel" width="320" height="320"></a>
      <div class="menu">
        <label for="menu-toggle" class="menu-close" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 20 20" focusable="false"><path d="M1.25 18.75L18.75 1.25M18.75 18.75L1.25 1.25" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </label>
        <nav aria-label="Main">
          <ul>
            $nav
          </ul>
        </nav>
      </div>
      <label for="menu-toggle" class="menu-backdrop" aria-hidden="true"></label>
      $shop_icon
    </div>
  </header>
  <main id="main" class="wrap">
$content
  </main>
  <footer class="site-footer">
    <div class="wrap">
      $social
      <p>Joel</p>
      <button class="cookie-settings" type="button" hidden>Cookie settings</button>
    </div>
  </footer>
  <div class="consent" role="region" aria-labelledby="consent-heading" hidden>
    <div class="wrap">
      <p id="consent-heading" class="consent-title">Spotify players</p>
      <p>This site has no cookies of its own. The music players come from Spotify, which may set cookies and receive
        your IP address when they load. Show them? <a href="https://www.spotify.com/legal/privacy-policy/">Spotify’s privacy policy</a></p>
      <div class="consent-actions">
        <button class="button" type="button" data-consent="yes">Allow</button>
        <button class="button" type="button" data-consent="no">No thanks</button>
      </div>
    </div>
  </div>
</body>
</html>
