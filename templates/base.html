<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Joel">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$share_image">
  <meta property="og:image:width" content="$share_width">
  <meta property="og:image:height" content="$share_height">
  <meta property="og:image:alt" content="Joel">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  <meta name="twitter:image" content="$share_image">
  <link rel="icon" href="${root}assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="${root}assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="${root}assets/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" href="${root}assets/fonts/outfit_n4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="${root}assets/fonts/rethink_sans_n7.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="${root}assets/style.css">
  <script src="${root}assets/player.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="$root"$home_current><img src="${root}assets/logo.png" alt="Joel" width="320" height="162"></a>
      <nav aria-label="Main">
        <ul>
          $nav
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
$content
  </main>
  <footer class="site-footer">
    <div class="wrap">
      $social
      <p>Joel</p>
    </div>
  </footer>
</body>
</html>
